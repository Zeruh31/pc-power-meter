name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PcPowerMeter.sln

      - name: Build
        run: dotnet build PcPowerMeter.sln -c Release --no-restore

      - name: Test
        run: dotnet test PcPowerMeter.sln -c Release --no-build --verbosity normal
